name: Vistazo LMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vistazo
          POSTGRES_PASSWORD: vistazo_ci_password
          POSTGRES_DB: vistazo_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Verify pure PostgreSQL SQL script
        env:
          PGPASSWORD: vistazo_ci_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U vistazo -d vistazo_lms -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          psql -h localhost -U vistazo -d vistazo_lms -v ON_ERROR_STOP=1 -f database/0001_initial_schema.sql
          psql -h localhost -U vistazo -d vistazo_lms -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Run Alembic migrations and seed on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vistazo:vistazo_ci_password@localhost:5432/vistazo_lms
        run: |
          alembic upgrade head
          python -m app.db.seed

      - name: Run pytest suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vistazo:vistazo_ci_password@localhost:5432/vistazo_lms
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
