[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vistazo-lms-backend"
version = "0.1.0"
description = "Backend FastAPI multi-tenant para plataforma LMS gamificada Vistazo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.1",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.25.1",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
